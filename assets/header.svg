<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Anupam Aryal — Full Stack Developer</title>
  <desc id="d">Animated banner: Anupam Aryal, Full Stack Developer based in Kathmandu, Nepal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect x="0" y="0" width="1000" height="300" rx="26"/></clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: "Segoe UI", Inter, Ubuntu, "Helvetica Neue", Arial, sans-serif; }

      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(70px,-40px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-80px,45px); } }
      .orb1 { animation: drift1 16s ease-in-out infinite; }
      .orb2 { animation: drift2 20s ease-in-out infinite; }

      @keyframes sweep { 0% { transform: translateX(-420px); } 60%,100% { transform: translateX(1240px); } }
      .sheen { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }

      @keyframes rise { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
      .r1 { animation: rise .7s ease-out both .05s; }
      .r2 { animation: rise .7s ease-out both .20s; }
      .r3 { animation: rise .7s ease-out both .35s; }
      .r4 { animation: rise .7s ease-out both .50s; }

      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .rule { transform-origin: 56px 50%; animation: grow .9s cubic-bezier(.2,.8,.2,1) both .45s; }

      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(1.45); } }
      .dot { transform-origin: center; transform-box: fill-box; animation: pulse 2.2s ease-in-out infinite; }

      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .caret { animation: blink 1s steps(1) infinite; }

      /* rotating role line */
      @keyframes role1 { 0%,26% { opacity:1 } 33%,93% { opacity:0 } 100% { opacity:1 } }
      @keyframes role2 { 0%,30% { opacity:0 } 37%,60% { opacity:1 } 67%,100% { opacity:0 } }
      @keyframes role3 { 0%,63% { opacity:0 } 70%,90% { opacity:1 } 97%,100% { opacity:0 } }
      .role1 { animation: role1 9s ease-in-out infinite; }
      .role2 { animation: role2 9s ease-in-out infinite; }
      .role3 { animation: role3 9s ease-in-out infinite; }

      @keyframes typeIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
      .c1 { animation: typeIn .45s ease-out both .60s; }
      .c2 { animation: typeIn .45s ease-out both .78s; }
      .c3 { animation: typeIn .45s ease-out both .96s; }
      .c4 { animation: typeIn .45s ease-out both 1.14s; }
      .c5 { animation: typeIn .45s ease-out both 1.32s; }
      .c6 { animation: typeIn .45s ease-out both 1.50s; }

      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      .win { animation: float 6s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .orb1,.orb2,.sheen,.dot,.caret,.win,.role1,.role2,.role3 { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <g opacity="0.55">
      <circle class="orb1" cx="170" cy="60" r="150" fill="#6366f1" filter="url(#soft)"/>
      <circle class="orb2" cx="880" cy="270" r="160" fill="#06b6d4" filter="url(#soft)"/>
      <circle class="orb1" cx="620" cy="20" r="110" fill="#a855f7" filter="url(#soft)" opacity="0.5"/>
    </g>

    <rect class="sheen" x="-260" y="-40" width="180" height="380" fill="url(#sheen)" transform="skewX(-18)"/>

    <!-- ── left column ─────────────────────────────────────────── -->
    <g class="r1">
      <rect x="56" y="52" width="9" height="9" rx="2" fill="#22d3ee"/>
      <text class="mono" x="78" y="61" font-size="13" letter-spacing="3.4" fill="#7dd3fc">HELLO, WORLD — I'M</text>
    </g>

    <text class="sans r2" x="56" y="126" font-size="54" font-weight="700" fill="url(#nameGrad)" letter-spacing="-1">Anupam Aryal</text>

    <rect class="rule" x="56" y="142" width="300" height="3" rx="1.5" fill="url(#ruleGrad)"/>

    <g class="r3">
      <text class="sans role1" x="56" y="182" font-size="21" font-weight="600" fill="#c7d2fe" opacity="1">Full Stack Developer</text>
      <text class="sans role2" x="56" y="182" font-size="21" font-weight="600" fill="#c7d2fe" opacity="0">React · Next.js · TypeScript</text>
      <text class="sans role3" x="56" y="182" font-size="21" font-weight="600" fill="#c7d2fe" opacity="0">FastAPI · PostgreSQL · AI apps</text>
    </g>

    <g class="r4">
      <!-- location pill -->
      <rect x="56" y="212" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#94a3b8" stroke-opacity="0.22"/>
      <path d="M76 222c-3.6 0-6.5 2.9-6.5 6.5 0 4.9 6.5 11.5 6.5 11.5s6.5-6.6 6.5-11.5c0-3.6-2.9-6.5-6.5-6.5zm0 8.9a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z" fill="#38bdf8"/>
      <text class="sans" x="92" y="234" font-size="14" fill="#cbd5e1">Kathmandu, Nepal</text>

      <!-- open to work pill -->
      <rect x="266" y="212" width="180" height="34" rx="17" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.35"/>
      <circle class="dot" cx="288" cy="229" r="4.5" fill="#4ade80" filter="url(#glow)"/>
      <text class="sans" x="302" y="234" font-size="14" fill="#86efac">Open to opportunities</text>
    </g>

    <!-- ── right column: code window ────────────────────────────── -->
    <g class="win">
      <rect x="572" y="48" width="384" height="204" rx="14" fill="url(#glassGrad)" stroke="#94a3b8" stroke-opacity="0.20"/>
      <line x1="572" y1="82" x2="956" y2="82" stroke="#94a3b8" stroke-opacity="0.18"/>
      <circle cx="594" cy="65" r="5" fill="#f87171"/>
      <circle cx="612" cy="65" r="5" fill="#fbbf24"/>
      <circle cx="630" cy="65" r="5" fill="#34d399"/>
      <text class="mono" x="654" y="70" font-size="11.5" fill="#64748b">anupam.ts</text>

      <text class="mono c1" xml:space="preserve" x="594" y="110" font-size="13"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> me </tspan><tspan fill="#94a3b8">= {</tspan></text>
      <text class="mono c2" xml:space="preserve" x="608" y="133" font-size="13"><tspan fill="#7dd3fc">stack</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"FastAPI"</tspan><tspan fill="#94a3b8">],</tspan></text>
      <text class="mono c3" xml:space="preserve" x="608" y="156" font-size="13"><tspan fill="#7dd3fc">db</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"PostgreSQL"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text class="mono c4" xml:space="preserve" x="608" y="179" font-size="13"><tspan fill="#7dd3fc">learning</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"AI / LangGraph"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text class="mono c5" xml:space="preserve" x="608" y="202" font-size="13"><tspan fill="#7dd3fc">shipping</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">true</tspan></text>
      <text class="mono c6" xml:space="preserve" x="594" y="225" font-size="13"><tspan fill="#94a3b8">}</tspan><tspan class="caret" fill="#22d3ee"> ▍</tspan></text>
    </g>

    <rect x="0.5" y="0.5" width="999" height="299" rx="26" fill="none" stroke="#94a3b8" stroke-opacity="0.18"/>
  </g>
</svg>
