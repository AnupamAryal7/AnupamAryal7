<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="3" width="1000" height="4" rx="2"/></clipPath>
    <style>
      @keyframes slide { 0% { transform: translateX(-240px); } 100% { transform: translateX(1240px); } }
      .s { animation: slide 4.5s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect x="0" y="3" width="1000" height="4" rx="2" fill="url(#g)"/>
    <rect class="s" x="0" y="3" width="220" height="4" fill="url(#spark)"/>
  </g>
</svg>
