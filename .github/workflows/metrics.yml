# Generates assets/metrics.svg and commits it back to this repo.
#
# Why self-hosted: the popular public stat services (github-readme-stats.vercel.app,
# github-profile-trophy.vercel.app) are frequently rate-limited or offline, which leaves
# broken images on the profile. Rendering the card here means it is always available.
#
# Recommended: create a classic PAT with `read:user` + `repo` scope and save it as the
# repository secret METRICS_TOKEN, then apply the two changes marked "needs METRICS_TOKEN"
# below.
#
# Why it matters: GITHUB_TOKEN is scoped to THIS repository only. User-level panels
# (header, activity, community, contribution calendar) are accurate with it, but the
# `repositories` panel and the languages plugin would only see this one repo — reporting
# "1 Repository / 0 Stargazers" and an empty language breakdown. They are therefore left
# off until a PAT is available, rather than rendering wrong numbers.
name: Generate GitHub metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render metrics card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AnupamAryal7
          filename: assets/metrics.svg
          template: classic
          config_timezone: Asia/Kathmandu
          config_display: large

          # needs METRICS_TOKEN: append `, repositories` and set base_indepth: yes
          base: header, activity, community

          # needs METRICS_TOKEN: flip plugin_languages to yes
          plugin_languages: no
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
