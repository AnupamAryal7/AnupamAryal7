<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="mt">
  <title id="mt">Live GitHub metrics — generated by GitHub Actions</title>
  <desc>Placeholder card. The "Generate GitHub metrics" workflow replaces this file with the real stats card on its first run.</desc>

  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#131c36"/>
    </linearGradient>
    <linearGradient id="shim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="macc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="mcard"><rect width="1000" height="220" rx="20"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", Inter, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; }
      @keyframes shimmer { 0% { transform: translateX(-320px); } 100% { transform: translateX(1320px); } }
      .sh { animation: shimmer 2.4s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { transform-origin: center; transform-box: fill-box; animation: spin 1.6s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .sh, .spin { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#mcard)">
    <rect width="1000" height="220" fill="url(#mbg)"/>

    <circle class="spin" cx="52" cy="52" r="12" fill="none" stroke="url(#macc)" stroke-width="3" stroke-linecap="round" stroke-dasharray="46 30"/>
    <text class="sans" x="82" y="50" font-size="17" font-weight="700" fill="#e2e8f0">Live GitHub metrics</text>
    <text class="mono" x="82" y="70" font-size="12" fill="#64748b">generated by GitHub Actions · refreshed daily</text>

    <g fill="#ffffff" fill-opacity="0.06">
      <rect x="40" y="104" width="270" height="14" rx="7"/>
      <rect x="40" y="130" width="200" height="14" rx="7"/>
      <rect x="40" y="156" width="238" height="14" rx="7"/>
      <rect x="360" y="104" width="270" height="14" rx="7"/>
      <rect x="360" y="130" width="176" height="14" rx="7"/>
      <rect x="360" y="156" width="248" height="14" rx="7"/>
      <rect x="680" y="104" width="280" height="66" rx="10"/>
    </g>
    <rect class="sh" x="-320" y="0" width="220" height="220" fill="url(#shim)"/>

    <rect x="0.5" y="0.5" width="999" height="219" rx="20" fill="none" stroke="#94a3b8" stroke-opacity="0.18"/>
  </g>
</svg>
